# Duet observability stack (all OSS, all self-hosted). Companion to
# langfuse-compose.yml (pinned upstream file — run both):
#   cd infra && cp .env.example .env
#   docker compose -f langfuse-compose.yml up -d      # Langfuse UI → :3000
#   docker compose -f observability-compose.yml up -d # Grafana    → :3001
#
# duet-postgres is OUR db (calls/benchmark/leads) — separate from Langfuse's
# internal postgres on purpose: Langfuse's schema is its own business.

services:
  duet-web:
    profiles: ["deploy"]
    build:
      context: ..
      dockerfile: web-demo/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://duet:${DUET_PG_PASSWORD:-replace-before-deploy}@duet-postgres:5432/duet
      LANGFUSE_HOST: http://langfuse-web:3000
      DUET_TELEMETRY_LOG: /data/telemetry/events.jsonl
      GEMINI_QUOTA_STATE_PATH: /data/quota/gemini.json
      TRUST_PROXY: "true"
      ALLOWED_ORIGINS: https://${DUET_DOMAIN:-voice.invalid}
    ports:
      - "127.0.0.1:8990:8990"
    volumes:
      - ../.local/telemetry:/data/telemetry
      - ../.local/quota:/data/quota
      - ../eval/asr/sessions:/app/eval/asr/sessions
    depends_on:
      duet-postgres:
        condition: service_healthy
    networks:
      - default
      - duet-backplane

  caddy:
    profiles: ["deploy"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DUET_DOMAIN: ${DUET_DOMAIN:-voice.invalid}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      duet-web:
        condition: service_healthy

  duet-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: duet
      POSTGRES_PASSWORD: ${DUET_PG_PASSWORD:-duet}
      POSTGRES_DB: duet
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - duet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duet"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana-oss:11.5.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-duet}
      DUET_PG_PASSWORD: ${DUET_PG_PASSWORD:-duet}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      duet-postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - ../.local/telemetry:/var/log/duet:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  duet_pg:
  grafana_data:
  prom_data:
  loki_data:
  alloy_data:
  caddy_data:
  caddy_config:

networks:
  duet-backplane:
    name: duet-backplane
    external: true
