# Prometheus scrapes the local browser server through Docker's host gateway.
# Short-lived benchmark summaries still go to Postgres because pull-based
# scraping cannot reliably observe a process that exits between intervals.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: duet-live
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8990", "duet-web:8990"]
