[project]
name = "duet-open-voice-runtime"
version = "0.1.0"
description = "Isolated local voice runtime for Duet (Silero, Parakeet MLX, Piper)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "huggingface-hub>=0.30.2",
    # parakeet-mlx 0.5.2 still declares numba~=0.53 even though its runtime
    # works with the current Python-3.12 build. Pin the proven local pair.
    "llvmlite>=0.48",
    "mlx-lm>=0.31.3",
    "numba>=0.66",
    "numpy>=2",
    "parakeet-mlx>=0.5",
    "piper-tts>=1.3",
    "psycopg[binary]>=3.2",
    "sarvamai>=0.1.28",
    "silero-vad>=6.2",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9"]

[tool.uv]
package = false
