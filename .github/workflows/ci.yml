# Duet CI — every commit gets: lint, unit tests (2 OSes), import smoke on
# Apple-Silicon and a production-container boot smoke. A paced live
# reasoning-layer golden eval (≥90% gate) runs daily or on demand.
#
# What CI deliberately does NOT do: run the 4.9 GB Moshi weights. That check
# (`duet-sdr` scripted mode, VERDICT: PASS) is the pre-push gate run locally,
# because pulling 5 GB per commit would be slow, flaky, and wasteful. See
# docs/DECISIONS.md 0006.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # One live behavior check per day avoids spending the project-wide
    # free-tier request budget again for every small commit.
    - cron: "17 2 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff (repository-pinned version)
        run: >-
          uvx --from 'ruff==0.15.20' ruff check
          agent web-demo/server.py scripts/smoke-live-demo.py
          eval/reasoning/run_eval.py

  unit:
    strategy:
      matrix:
        include:
          # Ubuntu proves the brain-side modules (persona/reasoning/injector)
          # are genuinely dependency-free: stdlib + pytest only, no MLX.
          - os: ubuntu-latest
            full-install: false
          # macOS (Apple Silicon) installs the real MLX stack and additionally
          # smoke-imports the audio-loop modules.
          - os: macos-latest
            full-install: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv
        working-directory: agent
        run: uv venv --python 3.12
      - name: Install (pure)
        if: ${{ !matrix.full-install }}
        working-directory: agent
        run: uv pip install pytest numpy aiohttp
      - name: Install (full MLX stack)
        if: ${{ matrix.full-install }}
        working-directory: agent
        run: uv pip install -e . --group dev
      - name: Unit tests
        working-directory: agent
        run: PYTHONPATH=. .venv/bin/pytest -q
      - name: Import smoke (audio loop modules)
        if: ${{ matrix.full-install }}
        working-directory: agent
        run: .venv/bin/python -c "import duet_agent.local_loop, duet_agent.sdr_loop; print('imports OK')"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production web image
        run: docker build --file web-demo/Dockerfile --tag duet-web:ci .
      - name: Boot as non-root and pass health checks
        run: |
          test "$(docker image inspect duet-web:ci --format '{{.Config.User}}')" = "duet"
          docker run --detach --name duet-web-ci --publish 8990:8990 \
            --env GEMINI_API_KEY=ci-placeholder \
            --env SARVAM_API_KEY=ci-placeholder \
            duet-web:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8990/healthz >/tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent http://127.0.0.1:8990/readyz
              exit 0
            fi
            sleep 2
          done
          docker logs duet-web-ci
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs duet-web-ci || true
      - name: Stop container
        if: always()
        run: docker rm --force duet-web-ci || true

  reasoning-eval:
    # Operators may explicitly opt pushes in with a repository variable.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.RUN_LIVE_EVAL_ON_PUSH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit, container]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EVAL_MIN_INTERVAL_SECONDS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Golden eval (gate ≥90%)
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret not configured"; exit 1
          fi
          python eval/reasoning/run_eval.py
